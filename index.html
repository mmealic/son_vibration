<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Carte du son</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
/* Layout: a clickable map (source, signal, ear) on top; the zoomed node's topics, widget and questions below. */
:root{
  --bg:#f4f5f9; --dot:#dcdfea; --card:#ffffff; --ink:#191c33; --muted:#5a5f7a; --line:#d3d6e3;
  --c1:#d8344f; --c2:#4152cf; --c3:#0b8a7f;
  --ok:#1b7f45; --ok-bg:#dcf3e4; --bad:#b92a36; --bad-bg:#fbe1e3;
  --scr:#13202b; --gridc:#2c4050; --trace:#ffd23f; --scr-ink:#e8eef2;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#13152a; --dot:#23264a; --card:#1d2040; --ink:#eef0fb; --muted:#a7abc9; --line:#363a66;
    --c1:#ff7088; --c2:#8f9bff; --c3:#3fd1c2; --ok:#6bd896; --ok-bg:#173d2a; --bad:#ff8d94; --bad-bg:#4a1f25; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#13152a; --dot:#23264a; --card:#1d2040; --ink:#eef0fb; --muted:#a7abc9; --line:#363a66;
  --c1:#ff7088; --c2:#8f9bff; --c3:#3fd1c2; --ok:#6bd896; --ok-bg:#173d2a; --bad:#ff8d94; --bad-bg:#4a1f25; color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
body{margin:0; color:var(--ink); font:400 17px/1.5 var(--body); background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1.2px, transparent 1.3px); background-size:22px 22px}
.wrap{max-width:1100px; margin:0 auto; padding-inline:16px; padding-block:14px 48px}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--c2); outline-offset:2px}
header{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px}
header h1{font:800 clamp(22px,4.6vw,32px)/1.15 var(--display); margin:0 auto 0 0; text-wrap:balance}
.pill{background:var(--card); border:2px solid var(--line); border-radius:999px; padding:4px 12px; font-weight:700; font-size:15px}
button.pill{border-color:var(--ink)}
.hint{color:var(--muted); margin:0 0 6px}
#map{display:block; width:100%; height:auto; touch-action:manipulation; user-select:none}
#map.zoomed{height:min(380px,48vh)}
#map .hot{cursor:pointer}
#map .sat rect{transition:transform .15s}
#map .sat:hover rect,#map .hot:hover .ring{stroke-width:4}
#map text{font-family:var(--body); font-weight:700; fill:var(--ink)}
.panel{background:var(--card); border:2px solid var(--line); border-radius:20px; padding:18px; margin-top:6px}
.phead{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.phead h2{font:800 24px/1.2 var(--display); margin:0 auto 0 0}
.sw{width:16px; height:16px; border-radius:50%; flex:none}
.back{background:none; border:2px solid var(--line); border-radius:999px; padding:4px 12px; font-size:15px; font-weight:700}
.tabs{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0}
.tab{border:2px solid var(--line); border-radius:999px; background:var(--bg); padding:6px 14px; font-weight:700; font-size:15px}
.tab[aria-selected="true"]{background:var(--zc); border-color:var(--zc); color:var(--card)}
.tab .tick{margin-left:6px}
.topic{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.25fr); gap:20px; align-items:start}
@media (max-width:760px){.topic{grid-template-columns:1fr}}
.topic h3{font:800 20px/1.25 var(--display); margin:0 0 8px}
.topic p{margin:0 0 10px}
.wid{background:var(--bg); border:2px solid var(--line); border-radius:16px; padding:12px; min-width:0}
.wid svg{display:block; width:100%; height:auto; color:var(--ink)}
.ft{font:700 12px var(--body); fill:currentColor}
.fs{font:700 12px var(--body); fill:var(--scr-ink)}
.ctl{display:grid; gap:8px; margin-top:10px}
.row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.btn{border:2px solid var(--ink); border-bottom-width:4px; border-radius:12px; background:var(--card); padding:8px 14px; font-weight:700}
.btn[aria-pressed="true"],.btn.on{background:var(--ink); color:var(--card)}
.sl{display:block; font-weight:700; font-size:15px; color:var(--muted)}
.sl input{display:block; width:100%; accent-color:var(--zc); height:28px}
.read{display:flex; flex-wrap:wrap; gap:6px 16px; font-variant-numeric:tabular-nums; margin-top:6px}
.read b{font:800 20px var(--display)}
.info{background:var(--card); border:2px solid var(--line); border-radius:12px; padding:10px 12px; margin-top:10px; min-height:56px}
.qs{margin-top:18px; display:grid; gap:12px}
.qs h4{font:800 17px var(--display); margin:0}
.q{border:2px solid var(--line); border-radius:14px; padding:12px; background:var(--bg)}
.q p{margin:0 0 8px; font-weight:700}
.opts{display:grid; gap:6px}
.opt{text-align:left; border:2px solid var(--line); border-bottom-width:3px; border-radius:10px; background:var(--card); padding:8px 12px}
.opt.good{border-color:var(--ok); background:var(--ok-bg)} .opt.wrong{border-color:var(--bad); background:var(--bad-bg)}
.opt:disabled{cursor:default; color:inherit}
.why{margin:8px 0 0; font-size:15px} .why b{color:var(--ok)} .why b.no{color:var(--bad)}
.redo{background:none; border:0; color:var(--muted); text-decoration:underline; font-size:14px; justify-self:start; padding:4px 0}
.cards{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-top:12px}
@media (max-width:760px){.cards{grid-template-columns:1fr}}
.card{border:2px solid var(--line); border-top:6px solid var(--zc); border-radius:14px; background:var(--bg); padding:12px 14px; text-align:left}
.card b{font:800 18px var(--display); display:block} .card span{color:var(--muted); font-size:15px; display:block}
.card i{font-style:normal; font-weight:700; font-size:14px; color:var(--zc)}
.dbbig{font:800 34px var(--display); font-variant-numeric:tabular-nums}
.zone{display:inline-block; border-radius:999px; padding:2px 12px; font-weight:700; color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <svg id="map" role="img" aria-label="map"></svg>
  <section class="panel" id="panel"></section>
</div>

const UI={
 h1:B("Le son, de la bouche à l'oreille","Sound, from mouth to ear"),

 play:B("▶ Écouter","▶ Listen"), stop:B("■ Arrêter","■ Stop"), freq:B("Fréquence f","Frequency f"), amp:B("Amplitude","Amplitude"),

 second:B("+ une deuxième source identique","+ a second identical source"), expo:B("Durée d'exposition sans risque, environ","Safe exposure time, roughly"),
 nolimit:B("pas de limite","no limit"),
 zones:[B("Infrasons","Infrasound"),B("Sons audibles","Audible"),B("Ultrasons","Ultrasound")],
 animals:[[B("Éléphant","Elephant"),5,10000],[B("Humain","Human"),20,20000],[B("Chien","Dog"),60,45000],[B("Chauve-souris","Bat"),2000,110000],[B("Dauphin","Dolphin"),75,150000]],
 media:[[B("Air","Air"),340],[B("Eau","Water"),1500],[B("Verre","Glass"),5500]],

 dbz:[[0,B("Calme","Quiet"),"#1b7f45"],[60,B("Gênant","Annoying"),"#a16207"],[85,B("Danger","Danger"),"#c2410c"],[120,B("Douleur","Pain"),"#b91c1c"]],
 ear:[["pav",B("Pavillon","Outer ear"),B("Il capte le son et le dirige vers le conduit.","It catches the sound and directs it into the canal.")],
      ["con",B("Conduit auditif","Ear canal"),B("Il guide la vibration de l'air jusqu'au tympan.","It guides the air's vibration to the eardrum.")],

      ["ner",B("Nerf auditif","Auditory nerve"),B("Il transmet le signal au cerveau, qui l'interprète comme un son.","It carries the signal to the brain, which interprets it as a sound.")]]
};
const NODES=[
 {id:"src", col:"--c1", title:B("La source","The source"), sub:B("Comment un son naît","How a sound is born"), topics:["vib","box","med","voice"]},
 {id:"wave", col:"--c2", title:B("Le signal","The signal"), sub:B("Ce qui voyage, et à quelle vitesse","What travels, and how fast"), topics:["per","amp","pitch","speed"]},
 {id:"ear", col:"--c3", title:B("L'oreille","The ear"), sub:B("Ce que l'on entend, et les dangers","What we hear, and the dangers"), topics:["ear","aud","db","prot"]}
];
const TOP={
 vib:{lab:B("Vibration","Vibration"), title:B("Tout son vient d'une vibration","Every sound comes from a vibration"), w:"pluck",
  body:B("Une corde de guitare, la peau d'un tambour, la membrane d'un haut-parleur, tes cordes vocales : quand ils émettent un son, ils vibrent. Pose la main sur ta gorge et dis « aaa » : tu sens la vibration.<br>Pince la corde et regarde-la.","A guitar string, a drum skin, a loudspeaker cone, your vocal cords: when they make a sound, they vibrate. Put your hand on your throat and say “aaa”: you can feel the vibration.<br>Pluck the string and watch it."),
  qs:[[B("Quel est le point commun entre une corde de guitare, un haut-parleur et les cordes vocales quand ils émettent un son ?","What do a guitar string, a loudspeaker and the vocal cords have in common when they make a sound?"),[B("Ils vibrent","They vibrate"),B("Ils chauffent","They heat up"),B("Ils se déplacent vers l'auditeur","They move towards the listener")],B("Un signal sonore est toujours produit par la vibration d'un objet.","A sound signal is always produced by a vibrating object.")],
      [B("On trempe un diapason qui sonne dans l'eau : des gouttes jaillissent. Qu'est-ce que cela montre ?","A ringing tuning fork is dipped in water: drops splash out. What does that show?"),[B("Ses branches vibrent","Its prongs are vibrating"),B("Il est chaud","It is hot"),B("L'eau produit le son","The water makes the sound")],B("La vibration est trop rapide pour être vue, mais l'eau la révèle.","The vibration is too fast to see, but the water reveals it.")]]},
 box:{lab:B("Résonance","Resonance"), title:B("La caisse de résonance","The sound box"), w:"pluck", box:1,
  body:B("Une corde seule remue très peu d'air : on l'entend à peine. Sur une guitare, la corde fait vibrer la caisse en bois, qui fait vibrer beaucoup plus d'air. La caisse de résonance amplifie le son.<br>Pince la corde avec et sans la caisse.","A string on its own moves very little air: you can barely hear it. On a guitar, the string makes the wooden body vibrate, and the body moves much more air. The sound box amplifies the sound.<br>Pluck the string with and without the box."),
  qs:[[B("À quoi sert la caisse de résonance d'une guitare ?","What is the sound box of a guitar for?"),[B("À amplifier le son","To amplify the sound"),B("À produire la vibration","To produce the vibration"),B("À rendre le son plus aigu","To make the sound higher")],B("La corde produit la vibration, la caisse l'amplifie.","The string produces the vibration, the box amplifies it.")],
      [B("Sans caisse, la corde vibre-t-elle ?","Without the box, does the string vibrate?"),[B("Oui, mais elle met peu d'air en mouvement : le son est faible","Yes, but it moves little air: the sound is quiet"),B("Non, elle ne vibre plus","No, it stops vibrating"),B("Oui, et le son est aussi fort","Yes, and the sound is just as loud")],B("La note est la même : seule la quantité d'air mise en vibration change.","The note is the same: only the amount of air set vibrating changes.")]]},
 med:{lab:B("Milieu","Medium"), title:B("Il faut de la matière","Matter is needed"), w:"bell",
  body:B("La vibration passe d'une particule d'air à la suivante. Sans matière, rien ne la transmet. Fais sonner le téléphone, puis retire l'air de la cloche.","The vibration passes from one particle of air to the next. With no matter, nothing passes it on. Make the phone ring, then remove the air from the jar."),
  qs:[[B("Sous la cloche vide, le téléphone sonne mais on ne l'entend plus. Pourquoi ?","Under the empty jar, the phone rings but can no longer be heard. Why?"),[B("Le son a besoin d'un milieu matériel pour se propager","Sound needs a material medium to travel"),B("Le téléphone s'arrête","The phone stops"),B("Le verre bloque tous les sons","Glass blocks all sounds")],B("Avec de l'air, on l'entendait très bien à travers le verre.","With air inside, it was easy to hear through the glass.")],
      [B("Dans quels milieux le son se propage-t-il ?","In which media does sound travel?"),[B("Air, eau, acier, mais pas le vide","Air, water, steel, but not a vacuum"),B("Seulement dans l'air","Only in air"),B("Partout, même dans le vide","Everywhere, even in a vacuum")],B("Gaz, liquides et solides sont des milieux matériels.","Gases, liquids and solids are material media.")],
      [B("Pourquoi une explosion dans l'espace est-elle silencieuse ?","Why is an explosion in space silent?"),[B("L'espace est presque vide","Space is almost empty"),B("Il y fait trop froid","It is too cold there"),B("Le son y va trop vite","Sound travels too fast there")],B("Pas de matière, pas de son. Les astronautes se parlent par radio.","No matter, no sound. Astronauts talk by radio.")]]},
 voice:{lab:B("La voix","The voice"), title:B("Ta voix","Your voice"), w:"voice",
  body:B("Tes cordes vocales vibrent quand l'air des poumons passe entre elles. Plus elles vibrent vite, plus la voix est aiguë. Ce sont des valeurs moyennes : chaque voix est différente.","Your vocal cords vibrate when air from the lungs passes between them. The faster they vibrate, the higher the voice. These are average values: every voice is different."),
  qs:[[B("Une voix d'enfant est plus aiguë qu'une voix d'homme. Sa fréquence est donc…","A child's voice is higher than a man's. Its frequency is therefore…"),[B("plus grande","higher"),B("plus petite","lower"),B("la même","the same")],B("Son plus aigu, fréquence plus grande.","Higher sound, higher frequency.")],
      [B("Quand tu chantes une note plus aiguë, tes cordes vocales vibrent…","When you sing a higher note, your vocal cords vibrate…"),[B("plus vite","faster"),B("plus lentement","more slowly"),B("plus fort, mais à la même vitesse","harder, but at the same rate")],B("Plus de vibrations par seconde : la fréquence augmente.","More vibrations per second: the frequency increases.")]]},
 per:{lab:B("Période","Period"), title:B("Période et fréquence","Period and frequency"), w:"wave",

  qs:[[B("Que mesure la fréquence ?","What does frequency measure?"),[B("Le nombre de motifs par seconde","The number of patterns per second"),B("La durée d'un motif","The duration of one pattern"),B("La hauteur de la courbe","The height of the curve")],B("Elle s'exprime en hertz (Hz).","It is expressed in hertz (Hz).")],
      [B("Un signal a une période T = 4 ms = 0,004 s. Quelle est sa fréquence ?","A signal has a period T = 4 ms = 0.004 s. What is its frequency?"),["250 Hz","4 Hz","400 Hz"],B("f = 1 ÷ 0,004 = 250 Hz.","f = 1 ÷ 0.004 = 250 Hz.")],
      [B("Si la fréquence augmente, la période…","If the frequency increases, the period…"),[B("diminue","decreases"),B("augmente","increases"),B("ne change pas","stays the same")],B("Plus de motifs par seconde, donc des motifs plus courts.","More patterns per second, so shorter patterns.")]]},
 amp:{lab:B("Amplitude","Amplitude"), title:B("L'amplitude","Amplitude"), w:"wave",
  body:B("L'amplitude est la hauteur maximale de la courbe par rapport à l'axe. Plus elle est grande, plus le son est fort. Change l'amplitude : la période, elle, ne bouge pas.","Amplitude is the greatest height of the curve above the axis. The larger it is, the louder the sound. Change the amplitude: the period does not move."),
  qs:[[B("On monte le volume d'une note. Que se passe-t-il sur l'écran ?","You turn up the volume of a note. What happens on the screen?"),[B("L'amplitude augmente, la période ne change pas","The amplitude increases, the period does not change"),B("La période diminue","The period decreases"),B("La forme change","The shape changes")],B("Un son plus fort n'est ni plus aigu ni plus grave.","A louder sound is neither higher nor lower.")],
      [B("À quelle grandeur l'amplitude est-elle liée ?","Which quantity is amplitude linked to?"),[B("À l'intensité sonore","Sound intensity"),B("À la fréquence","Frequency"),B("À la célérité","Speed")],B("Grande amplitude, grande intensité sonore, niveau sonore élevé.","Large amplitude, high sound intensity, high sound level.")]]},
 pitch:{lab:B("Hauteur, timbre","Pitch, timbre"), title:B("Hauteur et timbre","Pitch and timbre"), w:"wave",
  body:B("La hauteur dit si un son est grave ou aigu : elle dépend de la fréquence.<br>Le timbre permet de reconnaître un instrument : même note, même période, mais une forme de signal différente. Essaie les trois timbres à la même fréquence.","Pitch tells you whether a sound is low or high: it depends on frequency.<br>Timbre lets you recognise an instrument: same note, same period, but a different signal shape. Try the three timbres at the same frequency."),
  qs:[[B("Plus la fréquence est élevée, plus le son est…","The higher the frequency, the more the sound is…"),[B("aigu","high-pitched"),B("grave","low-pitched"),B("fort","loud")],B("La hauteur est liée à la fréquence.","Pitch is linked to frequency.")],
      [B("Un piano et un violon jouent le même la. Qu'est-ce qui diffère ?","A piano and a violin play the same A. What differs?"),[B("La forme du signal (le timbre)","The signal shape (timbre)"),B("La période","The period"),B("La fréquence","The frequency")],B("Même note, donc même période et même fréquence.","Same note, so same period and same frequency.")],
      [B("Quel signal correspond à un son pur ?","Which signal is a pure tone?"),[B("Une sinusoïde","A sine curve"),B("Un signal avec plusieurs bosses","A signal with several bumps"),B("Une ligne droite","A straight line")],B("Le diapason produit un son pur.","A tuning fork produces a pure tone.")]]},
 speed:{lab:B("Célérité","Speed"), title:B("La célérité du son","The speed of sound"), w:"speed",
  body:B("v = d ÷ Δt, avec v en m/s, d en mètres et Δt en secondes.<br>Dans l'air, le son va à environ 340 m/s. Il va plus vite dans les liquides, et encore plus dans les solides. Choisis un milieu et une distance, puis lance le son : l'animation est en temps réel.","v = d ÷ Δt, with v in m/s, d in metres and Δt in seconds.<br>In air, sound travels at about 340 m/s. It is faster in liquids, and faster still in solids. Choose a medium and a distance, then send the sound: the animation runs in real time."),

const H={pur:[1],fl:[1,.45,.2,.08],vi:[1,.75,.6,.5,.3,.25]}, PH=[0,.6,1.9,.3,2.4,1.1];
const wav=(h,x)=>{let s=0;for(let i=0;i<h.length;i++) s+=h[i]*Math.sin((i+1)*x+PH[i]); return s;};

function pw(a,sh){ const h=H[sh], re=new Float32Array(h.length+1), im=new Float32Array(h.length+1); h.forEach((v,i)=>{re[i+1]=v*Math.sin(PH[i]); im[i+1]=v*Math.cos(PH[i]);}); return a.createPeriodicWave(re,im); }

  if(sh!==curSh){ osc.setPeriodicWave(pw(a,sh)); curSh=sh; } osc.frequency.setTargetAtTime(f,a.currentTime,.015); gn.gain.setTargetAtTime(vol,a.currentTime,.03); }catch(e){} }
function hush(){ try{ if(gn) gn.gain.setTargetAtTime(0,AC.currentTime,.03); }catch(e){} }
function blip(f,sh,peak,dur){ try{ const a=ctx(), o=a.createOscillator(), g=a.createGain(); o.setPeriodicWave(pw(a,sh)); o.frequency.value=f;
  g.gain.setValueAtTime(peak,a.currentTime); g.gain.exponentialRampToValueAtTime(.0005,a.currentTime+dur); o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur+.05); }catch(e){} }

function openNode(id){ const n=NODES.find(x=>x.id===id); openTopic(n.topics.find(t=>!TOP[t].qs.every((_,k)=>ANS[t+k]!=null))||n.topics[0]); }

function seeded(id,n){ let s=0; for(const c of id) s=(s*31+c.charCodeAt(0))%9973; const a=[...Array(n).keys()]; for(let i=n-1;i>0;i--){ s=(s*7919+17)%9973; const j=s%(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
